[package]
name = "motif-editor"
description = "Редактор Motif: скрипт сцены с живым превью, холст, слои, свойства и таймлайн"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "motif-editor"
path = "src/main.rs"

[dependencies]
motif-core.workspace = true
motif-html.workspace = true
motif-script.workspace = true
motif-render = { workspace = true, features = ["gpu"] }
motif-pixel.workspace = true
motif-web.workspace = true
motif-link.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
tiny-skia.workspace = true
flate2 = "1"
