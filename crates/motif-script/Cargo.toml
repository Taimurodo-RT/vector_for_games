[package]
name = "motif-script"
description = "Скрипт сцены Motif (.msc): парсер с позициями значений и обратная запись правок из редактора"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
linesweeper = "0.5"
motif-core.workspace = true
usvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
