[package]
name = "motif-runtime"
description = "Проигрыватель сцены Motif для игр: холст, машина состояний, входы, стороны, события и кадр — без движка и окна"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# The frame as triangles for a GPU that paints them itself (MotifSprite in Godot).
mesh = ["motif-render/mesh"]
# The frame as a `vello::Scene`, for a game that draws many poses in one pass (Forge). The Vello
# and wgpu versions are the workspace's: one version for Motif and Forge, raised together.
vello = ["motif-render/gpu"]

[dependencies]
# serde: the playing state is saved with the game (`save_state`).
motif-core = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a saved state reads back to the same bits, so a loaded game plays on the same.
serde_json = { workspace = true, features = ["float_roundtrip"] }
motif-script.workspace = true
motif-render.workspace = true
tiny-skia.workspace = true

[dev-dependencies]
pollster.workspace = true
