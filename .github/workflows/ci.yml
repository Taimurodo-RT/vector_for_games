name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p motif-cli -- check examples/bounce.msc
      - run: cargo run -p motif-cli -- check examples/gem.msc
      - run: cargo run -p motif-cli -- check examples/card.msc
      - run: cargo run -p motif-cli -- check examples/title.msc
      - run: cargo run -p motif-cli -- check examples/depth.msc
      - run: cargo run -p motif-cli -- check examples/symbols.msc
      - run: cargo run -p motif-cli -- check examples/machine.msc
      - run: cargo run -p motif-cli -- check examples/bones.msc
      - run: cargo run -p motif-cli -- check examples/tunnel.msc
      - run: cargo run -p motif-cli -- check examples/jelly.msc
      - run: cargo run -p motif-cli -- check examples/springs.msc
      - run: cargo run -p motif-cli -- check examples/squash.msc
      - run: cargo run -p motif-cli -- check examples/orbit.msc
      - run: cargo run -p motif-cli -- check examples/particles.msc
      - run: cargo run -p motif-cli -- check examples/ropes.msc
      - run: cargo run -p motif-cli -- check examples/fluids.msc
      - run: cargo run -p motif-cli -- check examples/rolling.msc
      - run: cargo run -p motif-cli -- check examples/world.msc
      - run: cargo run -p motif-cli -- check examples/fields.msc

  # Windows build. On main it is also published as the release that update.bat downloads.
  windows-build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          "MOTIF_BUILD=$(Get-Date -Format yyyy.MM.dd)-$sha" >> $env:GITHUB_ENV
      - run: cargo build --release -p motif-editor -p motif-cli
      - name: Collect the build
        shell: pwsh
        run: packaging/windows/package.ps1 -Out Motif -Version $env:MOTIF_BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: Motif-windows-x64
          path: Motif
      - name: Publish the release for update.bat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete motif-build --cleanup-tag --yes 2>$null
          $notes = "Сборка $env:MOTIF_BUILD из ${{ github.sha }}. Обновление на ПК: update.bat в папке Motif."
          gh release create motif-build Motif-windows-x64.zip Motif/version.txt --target ${{ github.sha }} --title "Motif $env:MOTIF_BUILD" --notes $notes --latest
