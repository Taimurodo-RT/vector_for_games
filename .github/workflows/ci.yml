name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Native clipboard feature graph
        shell: bash
        run: |
          features=$(cargo tree --locked -p motif-editor -e features -i egui-winit --prefix none)
          printf '%s\n' "$features"
          [[ "$features" == *'eframe feature "clipboard"'* ]]
          [[ "$features" == *'egui-winit feature "clipboard"'* ]]
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: motif-runtime alone, as Forge links it (no Godot, no window)
        shell: bash
        run: |
          cargo test --locked -p motif-runtime
          ! cargo tree --locked -p motif-runtime --prefix none | grep -E '^(godot|eframe|egui|winit) '
      - name: Windows updater rollback and package validation
        if: runner.os == 'Windows'
        shell: powershell
        run: packaging/windows/test-update.ps1
      - run: cargo run -p motif-cli -- web examples/web-assets.msc -o target/web-check --strict
      - run: cargo run -p motif-cli -- check examples/bounce.msc
      - run: cargo run -p motif-cli -- check examples/gem.msc
      - run: cargo run -p motif-cli -- check examples/compound-paths.msc
      - run: cargo run -p motif-cli -- check examples/character-side.msc
      - run: cargo run -p motif-cli -- check examples/character-platformer.msc
      - run: cargo run -p motif-cli -- check examples/character-portrait.msc
      - run: cargo run -p motif-cli -- check examples/character-anime.msc
      - run: cargo run -p motif-cli -- inspect examples/character-anime.msc --anim Combinations --time 1 --node head -o target/combinations.json
      - run: cargo run -p motif-cli -- import-html examples/import/button.html --css examples/import/button.css -o target/imported-ui.msc
      - run: cargo run -p motif-cli -- check target/imported-ui.msc
      - run: cargo run -p motif-cli -- render target/imported-ui.msc --anim Hover --time 0.2 -o target/imported-ui-hover.png
      - run: cargo run -p motif-cli -- import-html examples/import/text-elements.html --css examples/import/text-elements.css -o target/imported-text.msc
      - run: cargo run -p motif-cli -- check target/imported-text.msc
      - run: cargo run -p motif-cli -- render target/imported-text.msc -o target/imported-text.png
      - run: cargo run -p motif-cli -- import-html examples/import/uiverse-play.html --css examples/import/uiverse-play.css -o target/imported-play.msc
      - run: cargo run -p motif-cli -- check target/imported-play.msc
      - run: cargo run -p motif-cli -- render target/imported-play.msc --anim HoverLoop --time 0.3 -o target/imported-play.png
      - run: cargo run -p motif-cli -- godot examples/character-anime.msc --node portrait --fps 6 -o target/anime-check
      - run: cargo run -p motif-cli -- godot examples/character-portrait.msc --node hero -o target/portrait-check
      - run: cargo run -p motif-cli -- godot examples/character-platformer.msc --node hero -o target/platformer-check
      - run: cargo run -p motif-cli -- godot examples/character-side.msc --node hero -o target/character-check
      - run: cargo run -p motif-cli -- check examples/card.msc
      - run: cargo run -p motif-cli -- check examples/title.msc
      - run: cargo run -p motif-cli -- check examples/depth.msc
      - run: cargo run -p motif-cli -- check examples/symbols.msc
      - run: cargo run -p motif-cli -- check examples/machine.msc
      - run: cargo run -p motif-cli -- contract examples/machine.msc -o target/machine.contract.json
      - run: cargo run -p motif-cli -- godot examples/machine.msc --node hero -o target/godot-check
      - run: cargo run -p motif-cli -- video examples/bounce.msc --anim Idle --fps 12 -o target/video-check/idle.gif
      - run: cargo run -p motif-cli -- video examples/machine.msc --machine Hero --take "0.5 speed=1, 1.5 jump" --fps 12 -o target/video-check/run.gif
      - run: cargo run -p motif-cli -- check examples/bones.msc
      - run: cargo run -p motif-cli -- check examples/weights.msc
      - run: cargo run -p motif-cli -- check examples/tunnel.msc
      - run: cargo run -p motif-cli -- check examples/jelly.msc
      - run: cargo run -p motif-cli -- check examples/springs.msc
      - run: cargo run -p motif-cli -- check examples/squash.msc
      - run: cargo run -p motif-cli -- check examples/orbit.msc
      - run: cargo run -p motif-cli -- check examples/particles.msc
      - run: cargo run -p motif-cli -- check examples/ropes.msc
      - run: cargo run -p motif-cli -- check examples/fluids.msc
      - run: cargo run -p motif-cli -- check examples/rolling.msc
      - run: cargo run -p motif-cli -- check examples/menu.msc
      - run: cargo run -p motif-cli -- check examples/world.msc
      - run: cargo run -p motif-cli -- check examples/morph.msc
      - run: cargo run -p motif-cli -- check examples/bodies.msc
      - run: cargo run -p motif-cli -- check examples/ui-kit.msc
      - run: cargo run -p motif-cli -- check examples/brushes.msc
      - run: cargo run -p motif-cli -- check examples/modern-button.msc
      - run: cargo run -p motif-cli -- check examples/fields.msc
      - run: cargo run -p motif-cli -- check examples/ui-effects.msc
      - run: cargo run -p motif-cli -- godot examples/directions.msc -o target/godot-sides-check
      - shell: bash
        run: for f in examples/screens/*.msc; do cargo run -q -p motif-cli -- check "$f" || exit 1; done
      - run: cargo run -p motif-cli -- screen godot-apps/calculator/calculator.msc -o target/apps-check/calculator
      - run: cargo run -p motif-cli -- screen godot-apps/focus/focus.msc -o target/apps-check/focus

  # MotifSprite in a real Godot: the addon loads, plays the machine, sends events, draws.
  godot-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p motif-godot
      - name: Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
      - run: godot-addon/test/run.sh "$PWD/Godot_v4.3-stable_linux.x86_64" "$PWD/target/debug/libmotif_godot.so"
      - name: motif runtime into a project
        run: |
          mkdir -p target/runtime-check/ui && echo 'config_version=5' > target/runtime-check/project.godot
          cargo run -p motif-cli -- runtime examples/modern-button.msc -o target/runtime-check/ui
          test -f target/runtime-check/addons/motif/motif.gdextension && test -f target/runtime-check/ui/fonts/Inter-Medium.ttf
      # Export templates are a gigabyte: kept between runs.
      - uses: actions/cache@v4
        with:
          path: templates.tpz
          key: godot-templates-4.3-stable
      - name: Godot 4.3 export templates
        run: test -f templates.tpz || curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
      - run: sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
      # Install, a person's edit, reinstall, export, the game from another folder: exit code 0.
      - name: Delivery end to end
        run: |
          cargo build -p motif-cli
          mkdir -p target/e2e-addon && cp -r godot-addon/addons/motif target/e2e-addon/
          mkdir -p target/e2e-addon/motif/bin && cp target/debug/libmotif_godot.so target/e2e-addon/motif/bin/
          echo ci > target/e2e-addon/motif/version.txt
          xvfb-run -s "-screen 0 1280x800x24" godot-addon/test/e2e/e2e.sh "$PWD/Godot_v4.3-stable_linux.x86_64" "$PWD/target/debug/motif" "$PWD/target/e2e-addon/motif" "$PWD/templates.tpz" "$PWD/target/e2e-shot.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shot-linux
          path: target/e2e-shot.png
          if-no-files-found: ignore

  # Windows build. On main it is also published as the release that update.bat downloads.
  windows-build:
    runs-on: windows-latest
    needs: [test, godot-runtime]
    permissions:
      contents: write
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          "MOTIF_BUILD=$(Get-Date -Format yyyy.MM.dd)-$sha" >> $env:GITHUB_ENV
      - run: cargo build --release -p motif-editor -p motif-cli
      # Built on its own, so the editor's GPU renderer does not end up in the Godot library.
      - run: cargo build --release -p motif-godot
      - name: Collect the build
        shell: pwsh
        run: packaging/windows/package.ps1 -Out Motif -Version $env:MOTIF_BUILD
      - uses: actions/cache@v4
        with:
          path: templates.tpz
          key: godot-templates-4.3-stable
      # The packed build itself, as it reaches the PC: its motif.exe and addon go into a fresh
      # project, which is exported with the 4.3 templates into game.exe, run from another folder.
      - name: Delivery end to end (game.exe)
        shell: bash
        run: |
          test -f templates.tpz || curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip
          7z x -y -bd godot.zip >/dev/null
          godot-addon/test/e2e/e2e.sh "$PWD/Godot_v4.3-stable_win64_console.exe" "$PWD/Motif/motif.exe" "$PWD/Motif/godot-addon/addons/motif" "$PWD/templates.tpz"
      - uses: actions/upload-artifact@v4
        with:
          name: Motif-windows-x64
          path: Motif
      - name: Publish the release for update.bat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete motif-build --cleanup-tag --yes 2>$null
          $notes = "Сборка $env:MOTIF_BUILD из ${{ github.sha }}. Обновление на ПК: update.bat в папке Motif."
          gh release create motif-build Motif-windows-x64.zip Motif/version.txt --target ${{ github.sha }} --title "Motif $env:MOTIF_BUILD" --notes $notes --latest
